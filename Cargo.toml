[package]
name = "rusty_falcon"
version = "0.8.0"
authors = ["CrowdStrike Inc"]
description = "Rust bindings for CrowdStrike Falcon API"
homepage = "https://github.com/CrowdStrike/rusty-falcon"
repository = "https://github.com/CrowdStrike/rusty-falcon"
readme = "README.md"
edition = "2024"
rust-version = "1.85.0"
license-file = "LICENSE"
keywords = ["api", "crowdstrike", "falcon", "security", "vulnerability"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[package.metadata.typos]
default = { extend-ignore-identifiers-re = [
    # ignore hexa data samples
    "[0-9a-fA-F][0-9a-fA-F]",
    "ot_",
    "_tto",
] }
files = { extend-exclude = [] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls"]
experimental = [
    "dep:async-trait",
    "dep:bon",
    "bon",
    "reqwest/stream",
    "serde_with/base64",
]
bon = []

[dependencies]
reqwest = { version = "0.12.28", features = [
    "charset",
    "json",
    "multipart",
], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"
serde_with = { version = "3.16.1", default-features = false, features = [
    "std",
    "macros",
] }
serde_repr = "0.1.20"
thiserror = "2.0.18"
url = "2.5.8"
async-trait = { version = "0.1.88", optional = true }
bon = { version = "3.8.2", optional = true }

[dev-dependencies]
clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
