[package]
name = "rusty_falcon"
version = "0.7.0"
authors = ["CrowdStrike Inc"]
homepage = "https://github.com/CrowdStrike/rusty-falcon"
repository = "https://github.com/CrowdStrike/rusty-falcon"
edition = "2024"
rust-version = "1.85.0"
license-file = "LICENSE"
keywords = ["api", "crowdstrike", "falcon", "security", "vulnerability"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[workspace.dependencies]
reqwest = { version = "0.12.28", default-features = false }
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.149"
serde_with = { version = "3.16.1", default-features = false, features = [
    "std",
    "macros",
] }
serde_repr = "0.1.20"
thiserror = "2.0.18"
url = "2.5.8"
async-trait = "0.1.88"
bon = "3.8.2"

[package]
name = "rusty_falcon"
version.workspace = true
authors.workspace = true
description = "Rust bindings for CrowdStrike Falcon API"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.typos]
default = { extend-ignore-identifiers-re = [
    # ignore hexa data samples
    "[0-9a-fA-F][0-9a-fA-F]",
    "ot_",
    "_tto",
] }
files = { extend-exclude = [] }

[features]
default = []
native-tls = ["reqwest/native-tls"]

[dependencies]
# To satisfy minimal version check
openssl = { version = "0.10.75", optional = true }
# To satisfy minimal version check
openssl-sys = { version = "0.9.111", optional = true }
reqwest = { version = "0.12.28", features = [
    "charset",
    "json",
    "multipart",
], default-features = false }
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.149"
serde_with = "3.16.1"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
